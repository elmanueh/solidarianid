name: CI/CD - SolidarianID

on:
  # El CI se ejecutará en cada push o pull request a la rama develop
  push:
    paths:
      - "solidarian-id/**"
      - "!docs/**"
    branches: [develop]
  pull_request:
    paths:
      - "solidarian-id/**"
      - "!docs/**"
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE_NAME: solidarianid

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    if: false # Deshabilitado temporalmente para testear CD
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: solidarian-id
    strategy:
      matrix:
        node-version: [24.x]

    services:
      db:
        image: postgres@sha256:ff4ccc02b97e0ebb6b328ef9ff92522f95586f83be6801896b615088defc8ad2
        env:
          POSTGRES_USER: sonar
          POSTGRES_PASSWORD: sonar
          POSTGRES_DB: sonar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sonar -d sonar"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

      sonarqube:
        image: sonarqube@sha256:47e573f85879254dafd7be9845f750155f33de8a6f33542015c31ce050917059
        env:
          SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
          SONAR_JDBC_USERNAME: sonar
          SONAR_JDBC_PASSWORD: sonar
        ports:
          - 9000:9000

    steps:
      # Setup
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix['node-version'] }}
          cache: npm
          cache-dependency-path: solidarian-id/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prettier & Lint
      - name: Run prettier check
        id: prettier_check
        continue-on-error: true
        run: npx prettier --check '**/*.{ts,js,json,css,html}'

      - name: Run prettier format
        if: steps.prettier_check.outcome == 'failure'
        run: npx prettier --write '**/*.{ts,js,json,css,html}'

      - name: Commit formatted files
        if: steps.prettier_check.outcome == 'failure'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add .
          git commit -m "chore(prettier-formatting): apply prettier formatting [skip ci]" || exit 0

          # Determinar rama destino
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.head_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          echo "Pushing to branch: $TARGET_BRANCH"

          # Traer remoto y rebasar para evitar non-fast-forward
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH" || (git rebase --abort && exit 1)

          # Push
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Run linter
        run: npm run lint:ci

      # Build
      - name: Build project
        run: npm run build

      # Tests
      - name: Run all tests with combined coverage
        run: npm run test:all:coverage

      # SonarQube
      - name: Install jq (for JSON parsing)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Wait for SonarQube to be UP
        run: |
          for i in {1..90}; do
            STATUS="$(curl -s http://localhost:9000/api/system/status | jq -r '.status' || true)"
            echo "SonarQube status: $STATUS"
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is UP"
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become UP in time"
          docker ps
          docker logs "$(docker ps -q --filter "ancestor=sonarqube:25.12.0.117093-community")" || true
          exit 1

      - name: Create project (idempotent) + generate token
        run: |
          PROJECT_KEY="SolidarianID"
          PROJECT_NAME="SolidarianID"

          # Sonarqube API to create project (idempotent)
          curl -s -u admin:admin -X POST "http://localhost:9000/api/projects/create" \
            -d "name=$PROJECT_NAME&project=$PROJECT_KEY" >/dev/null || true

          # Sonarqube API to generate token
          TOKEN_JSON="$(curl -s -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" \
            -d "name=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"

          SONAR_TOKEN="$(echo "$TOKEN_JSON" | jq -r '.token')"

          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "Failed to generate SONAR_TOKEN. Response:"
            echo "$TOKEN_JSON"
            exit 1
          fi

          echo "SONAR_TOKEN=$SONAR_TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT_KEY=$PROJECT_KEY" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Run SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: http://sonarqube:9000
        with:
          projectBaseDir: solidarian-id
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=${{ env.SONAR_PROJECT_NAME }}
            -Dsonar.sources=apps
            -Dsonar.inclusions=apps/**/src/**/*.ts
            -Dsonar.exclusions=**/dist/**,**/node_modules/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.js,**/*.json,**/*.css,**/*.html
            -Dsonar.tests=apps
            -Dsonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts
            -Dsonar.coverage.exclusions=**/*.entity.ts,**/*.dto.ts,**/*.filter.ts,**/*.guard.ts,**/*.mapper.ts,**/*.port.ts,**/fake*.ts,**/enums/**,**/model/**,**/models/**,**/main.ts,**/*.module.ts,**/jest*.config.ts,**/*.config.ts,**/*.d.ts,**/index.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Setup Java (required by CNES)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download CNES Report (standalone jar)
        run: |
          mkdir -p reports
          curl -L -o reports/sonar-cnes-report.jar \
           https://github.com/cnescatlab/sonar-cnes-report/releases/download/5.0.2/sonar-cnes-report-5.0.2.jar

      - name: Generate CNES report
        run: |
          mkdir -p reports/sonar
          java -jar reports/sonar-cnes-report.jar \
            -s http://localhost:9000 \
            -t "${{ env.SONAR_TOKEN }}" \
            -p "${{ env.SONAR_PROJECT_KEY }}" \
            -o reports/sonar

      - name: Upload CNES report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-cnes-report
          path: solidarian-id/reports/sonar
  cd:
    name: CD Pipeline
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    # needs: ci
    env:
      AWS_REGION: eu-south-2 # {{ secrets.AWS_REGION }}
      DOCKERHUB_USERNAME: zerep0 # {{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image tag
        id: image-tag
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="${SHORT_SHA}-$(date +%s)"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: zerep0 #${{ secrets.DOCKERHUB_USERNAME }}
          password: dckr_pat_XUXulXWMLguhYJVoYX205e-RSM8 #${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and push Docker images
        id: build-images
        working-directory: deployment
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Build all 3 apps
          docker compose -p deployment build admin-app users-app communities-app

          # Tag and push admin-app
          docker tag deployment-admin-app:latest zerep0/solidarianid-admin:$IMAGE_TAG
          docker tag deployment-admin-app:latest zerep0/solidarianid-admin:latest
          docker push zerep0/solidarianid-admin:$IMAGE_TAG
          docker push zerep0/solidarianid-admin:latest

          # Tag and push users-app
          docker tag deployment-users-app:latest zerep0/solidarianid-users:$IMAGE_TAG
          docker tag deployment-users-app:latest zerep0/solidarianid-users:latest
          docker push zerep0/solidarianid-users:$IMAGE_TAG
          docker push zerep0/solidarianid-users:latest

          # Tag and push communities-app
          docker tag deployment-communities-app:latest zerep0/solidarianid-communities:$IMAGE_TAG
          docker tag deployment-communities-app:latest zerep0/solidarianid-communities:latest
          docker push zerep0/solidarianid-communities:$IMAGE_TAG
          docker push zerep0/solidarianid-communities:latest

          echo "admin-image=zerep0/solidarianid-admin:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "users-image=zerep0/solidarianid-users:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "communities-image=zerep0/solidarianid-communities:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: AKIA4TJL7BLFRNZVE3E2 #${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: 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 #${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-2 # ${{ secrets.AWS_REGION }}

      - name: Deploy Network Stack
        working-directory: deployment
        run: |
          aws cloudformation deploy \
            --stack-name MyStackNetwork \
            --template-file lab-network.yaml \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset

      - name: Deploy Application Stack
        working-directory: deployment
        run: |
          aws cloudformation deploy \
            --stack-name MyStackApp \
            --template-file stack.yaml \
            --parameter-overrides DockerHubUsername=zerep0 \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset

      - name: Force new deployment (if stack unchanged)
        run: |
          set -euo pipefail

          INSTANCE_ID="$(aws cloudformation describe-stack-resources \
            --stack-name MyStackApp \
            --logical-resource-id WebServerInstance \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text)"

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No instance id found"
            exit 1
          fi

          echo "Forcing deployment on instance: $INSTANCE_ID"

          CMD_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user && docker-compose pull && docker-compose up -d --force-recreate"]' \
            --query "Command.CommandId" \
            --output text)"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM failed: $STATUS"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
            exit 1
          fi

      - name: Get deployment URLs
        id: get-urls
        run: |
          ADMIN_URL=$(aws cloudformation describe-stacks \
            --stack-name MyStackApp \
            --query 'Stacks[0].Outputs[?OutputKey==`AdminURL`].OutputValue' \
            --output text)
          USERS_URL=$(aws cloudformation describe-stacks \
            --stack-name MyStackApp \
            --query 'Stacks[0].Outputs[?OutputKey==`UsersURL`].OutputValue' \
            --output text)
          COMMUNITIES_URL=$(aws cloudformation describe-stacks \
            --stack-name MyStackApp \
            --query 'Stacks[0].Outputs[?OutputKey==`CommunitiesURL`].OutputValue' \
            --output text)
          echo "admin-url=${ADMIN_URL}" >> $GITHUB_OUTPUT
          echo "users-url=${USERS_URL}" >> $GITHUB_OUTPUT
          echo "communities-url=${COMMUNITIES_URL}" >> $GITHUB_OUTPUT

      - name: Deployment Status
        if: ${{ success() }}
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 Admin App URL: ${{ steps.get-urls.outputs.admin-url }}"
          echo "🚀 Users App URL: ${{ steps.get-urls.outputs.users-url }}"
          echo "🚀 Communities App URL: ${{ steps.get-urls.outputs.communities-url }}"

      - name: Deployment Failure Notification
        if: ${{ failure() }}
        run: |
          echo "❌ Deployment failed!"
