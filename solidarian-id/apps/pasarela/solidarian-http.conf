map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location ~ ^/api/users(/|$) {
    proxy_pass http://users-app:3001;
  }

  location ~ ^/api/(communities|causes|actions|requests|community-requests|cause-requests|action-requests|subscriptions)(/|$) {
    proxy_pass http://communities-app:3002;
  }

  location = /graphql {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;
    proxy_pass http://communities-app:3002/graphql;
  }

  location / {
    proxy_pass http://admin-app:3000;
  }
}