services:
  admin-app:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    container_name: solidarian_admin_app
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT}:3000'
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_ADMIN_CLIENT_ID=${KAFKA_ADMIN_CLIENT_ID}
      - KAFKA_ADMIN_CONSUMER_GROUP_ID=${KAFKA_ADMIN_CONSUMER_GROUP_ID}
      - COMMUNITIES_GRPC_URL=communities-app:50052
      - API_BASE_ADMIN_URL=${API_BASE_ADMIN_URL}
      - API_BASE_USERS_URL=${API_BASE_USERS_URL}
      - API_BASE_COMMUNITIES_URL=${API_BASE_COMMUNITIES_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - API_BASE_COMMUNITIES_INTERNAL_URL=${API_BASE_COMMUNITIES_INTERNAL_URL}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - solidarian_network

  users-app:
    build:
      context: .
      dockerfile: ./apps/users/Dockerfile
    container_name: solidarian_users_app
    restart: unless-stopped
    ports:
      - '${USERS_PORT}:3001'
    environment:
      - NODE_ENV=${NODE_ENV}
      - IN_DOCKER=true
      - FRONTEND_URL=${FRONTEND_URL}
      - JWT_PRIVATE_KEY_BASE64=${JWT_PRIVATE_KEY_BASE64}
      - JWT_PUBLIC_KEY_BASE64=${JWT_PUBLIC_KEY_BASE64}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USERS_DB=${POSTGRES_USERS_DB}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_USERS_CLIENT_ID=${KAFKA_USERS_CLIENT_ID}
      - KAFKA_USERS_CONSUMER_GROUP_ID=${KAFKA_USERS_CONSUMER_GROUP_ID}
      - EVENT_STORE_URL=${EVENT_STORE_URL}
      - API_BASE_ADMIN_URL=${API_BASE_ADMIN_URL}
      - API_BASE_USERS_URL=${API_BASE_USERS_URL}
      - API_BASE_COMMUNITIES_URL=${API_BASE_COMMUNITIES_URL}
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      - OAUTH_GOOGLE_CALLBACK_URI=${OAUTH_GOOGLE_CALLBACK_URI}
      - OAUTH_GOOGLE_CALLBACK_URI_PRODUCTION=${OAUTH_GOOGLE_CALLBACK_URI_PRODUCTION}
      - OAUTH_SUCCESS_REDIRECT_URL=${OAUTH_SUCCESS_REDIRECT_URL}
      - OAUTH_FAILURE_REDIRECT_URL=${OAUTH_FAILURE_REDIRECT_URL}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kurrentdb:
        condition: service_healthy
    networks:
      - solidarian_network

  communities-app:
    build:
      context: .
      dockerfile: ./apps/communities/Dockerfile
    container_name: solidarian_communities_app
    restart: unless-stopped
    ports:
      - '${COMMUNITIES_PORT}:3002'
      - '${COMMUNITIES_GRPC_PORT:-50052}:50052'
    environment:
      - NODE_ENV=${NODE_ENV}
      - IN_DOCKER=true
      - COMMUNITIES_GRPC_URL=0.0.0.0:50052
      - JWT_PRIVATE_KEY_BASE64=${JWT_PRIVATE_KEY_BASE64}
      - JWT_PUBLIC_KEY_BASE64=${JWT_PUBLIC_KEY_BASE64}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_COMMUNITIES_DB=${POSTGRES_COMMUNITIES_DB}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_COMMUNITIES_CLIENT_ID=${KAFKA_COMMUNITIES_CLIENT_ID}
      - KAFKA_COMMUNITIES_CONSUMER_GROUP_ID=${KAFKA_COMMUNITIES_CONSUMER_GROUP_ID}
      - API_BASE_ADMIN_URL=${API_BASE_ADMIN_URL}
      - API_BASE_USERS_URL=${API_BASE_USERS_URL}
      - API_BASE_COMMUNITIES_URL=${API_BASE_COMMUNITIES_URL}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - solidarian_network
