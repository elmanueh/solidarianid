[project]
name = "solidarian-ai"
version = "0.1.0"
description = "Microservicio de recomendación solidaria para SolidarianID"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.35.0",
    "numpy>=2.3.2",
    "scikit-learn>=1.7.1",
    "sentence-transformers>=5.1.0",
    "torch>=2.8.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0.43",
    "psutil>=7.0.0",
    "joblib>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "httpx>=0.28.1",
    "ruff>=0.12.8",
]
