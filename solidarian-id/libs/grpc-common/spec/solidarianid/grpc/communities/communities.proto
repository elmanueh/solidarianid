syntax="proto3";

package solidarianid.grpc.communities.v1;

service CommunitiesService{
  rpc GetCommunities(GetCommunitiesRequest) returns (GetCommunitiesResponse);
  rpc GetCommunityUsers(GetCommunityUsersRequest) returns (GetCommunityUsersResponse);
}

// === Schemas for GetCommunityUsers ===

message GetCommunityUsersRequest {
  string community_id = 1;
  optional int32 months = 2;
}

message CommunityLastUsersJoinedPeriod {
  string month = 1;
  int32 user_count = 2;
}

message GetCommunityUsersResponse {
  string community_name = 1;
  repeated CommunityLastUsersJoinedPeriod data_range = 2;
}

// === Schemas for GetCommunities ===

enum CommunityCriteria {
  COMMUNITY_CRITERIA_ALL_UNSPECIFIED = 0;
  COMMUNITY_CRITERIA_MOST_USERS = 1;
}

message GetCommunitiesRequest {
  CommunityCriteria criteria = 1;
  optional int32 limit = 2;
}

message CommunitySummary {
  string id = 1;
  string name = 2;
  string description = 3;
  string creator_id = 4;
}

message CommunityRankingUser {
  string id = 1;
  string name = 2;
  int32 user_count = 3;
}

message CommunitySummaryList {
  repeated CommunitySummary items = 1;
}

message CommunityRankingUserList {
  repeated CommunityRankingUser items = 1;
}

message GetCommunitiesResponse {
  oneof result {
    CommunitySummaryList summaries = 1;
    CommunityRankingUserList ranking = 2;
  }
}
