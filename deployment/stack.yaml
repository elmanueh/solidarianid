AWSTemplateFormatVersion: 2010-09-09
Description: >-
  SolidarianID Stack: EC2 instance with Docker for running 3 NestJS microservices
  (admin, users, communities) with PostgreSQL, MongoDB and Kafka.

Parameters:
  NetworkStackName:
    Description: >-
      Name of an active CloudFormation stack that contains the networking
      resources, such as the VPC and subnet that will be used in this stack.
    Type: String
    MinLength: 1
    MaxLength: 255
    AllowedPattern: "^[a-zA-Z][-a-zA-Z0-9]*$"
    Default: MyStackNetwork

  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  DockerHubUsername:
    Description: Docker Hub username for pulling images
    Type: String
    Default: Zerep0

Resources:
  WebServerInstance:
    Type: AWS::EC2::Instance
    Metadata:
      "AWS::CloudFormation::Init":
        configSets:
          All:
            - ConfigureSampleApp
        ConfigureSampleApp:
          packages:
            yum:
              docker: []
          services:
            sysvinit:
              docker:
                enabled: true
                ensureRunning: true

    Properties:
      IamInstanceProfile: !Ref WebServerInstanceProfile
      KeyName: solidarian-keypair
      InstanceType: t3.small
      ImageId: !Ref AmazonLinuxAMIID
      NetworkInterfaces:
        - GroupSet:
            - !Ref WebServerSecurityGroup
          AssociatePublicIpAddress: true
          DeviceIndex: 0
          DeleteOnTermination: true
          SubnetId:
            Fn::ImportValue: !Sub ${NetworkStackName}-SubnetID
      Tags:
        - Key: Name
          Value: SolidarianID Web Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum update -y aws-cfn-bootstrap
          # Install the files and packages from the metadata
          /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource WebServerInstance --configsets All --region ${AWS::Region}

          # Instalamos docker-compose
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          sudo usermod -aG docker ec2-user
          newgrp docker

          # Creamos el fichero docker-compose.yml con las 3 apps
          cat <<'EOT' > /home/ec2-user/docker-compose.yml
          version: '3.8'
          services:
            postgres:
              image: postgres:16
              container_name: solidarian_postgres
              environment:
                POSTGRES_USER: solidarian_user
                POSTGRES_PASSWORD: solidarian_dev_password
                POSTGRES_DB: solidarian_id_db
              ports:
                - "5432:5432"
              networks:
                - solidarian_network
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U solidarian_user -d solidarian_id_db"]
                interval: 10s
                timeout: 5s
                retries: 5

            mongo:
              image: mongo:7
              container_name: solidarian_mongo
              environment:
                MONGO_INITDB_ROOT_USERNAME: test
                MONGO_INITDB_ROOT_PASSWORD: test
                MONGO_INITDB_DATABASE: solidarianid
              ports:
                - "27017:27017"
              networks:
                - solidarian_network
              volumes:
                - mongo_data:/data/db
              healthcheck:
                test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
                interval: 10s
                timeout: 5s
                retries: 5

            kafka:
              image: apache/kafka:latest
              container_name: solidarian_kafka
              hostname: kafka
              ports:
                - "9092:9092"
              environment:
                KAFKA_NODE_ID: 1
                KAFKA_PROCESS_ROLES: broker,controller
                KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
                KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
                KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
                KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
                KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
                KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
                KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
              networks:
                - solidarian_network
              healthcheck:
                test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
                interval: 15s
                timeout: 10s
                retries: 10
                start_period: 30s

            admin-app:
              image: ${DockerHubUsername}/solidarianid-admin:latest
              container_name: solidarian_admin
              ports:
                - "3000:3000"
              environment:
                - NODE_ENV=production
                - MONGO_HOST=mongo
                - MONGO_PORT=27017
                - MONGO_USER=test
                - MONGO_PASSWORD=test
                - MONGO_DB=solidarianid
                - KAFKA_BROKERS=kafka:9093
              depends_on:
                mongo:
                  condition: service_healthy
                kafka:
                  condition: service_healthy
              networks:
                - solidarian_network
              restart: unless-stopped

            users-app:
              image: ${DockerHubUsername}/solidarianid-user:latest
              container_name: solidarian_users
              ports:
                - "3001:3001"
              environment:
                - NODE_ENV=production
                - POSTGRES_HOST=postgres
                - POSTGRES_PORT=5432
                - POSTGRES_USER=solidarian_user
                - POSTGRES_PASSWORD=solidarian_dev_password
                - POSTGRES_DB=solidarian_id_db
                - KAFKA_BROKERS=kafka:9093
              depends_on:
                postgres:
                  condition: service_healthy
                kafka:
                  condition: service_healthy
              networks:
                - solidarian_network
              restart: unless-stopped

            communities-app:
              image: ${DockerHubUsername}/solidarianid-community:latest
              container_name: solidarian_communities
              ports:
                - "3002:3002"
              environment:
                - NODE_ENV=production
                - POSTGRES_HOST=postgres
                - POSTGRES_PORT=5432
                - POSTGRES_USER=solidarian_user
                - POSTGRES_PASSWORD=solidarian_dev_password
                - POSTGRES_DB=solidarian_id_db
                - KAFKA_BROKERS=kafka:9093
              depends_on:
                postgres:
                  condition: service_healthy
                kafka:
                  condition: service_healthy
              networks:
                - solidarian_network
              restart: unless-stopped

          networks:
            solidarian_network:
              driver: bridge

          volumes:
            postgres_data:
            mongo_data:
          EOT

          cd /home/ec2-user
          docker-compose pull
          docker-compose up -d

          # Signal the status from cfn-init
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebServerInstance --region ${AWS::Region}
    CreationPolicy:
      ResourceSignal:
        Timeout: PT10M

  WebServerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: SolidarianID-EC2-Role

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebServerInstanceRole

  DiskVolume:
    Type: AWS::EC2::Volume
    Properties:
      Size: 100
      AvailabilityZone: !GetAtt WebServerInstance.AvailabilityZone
      Tags:
        - Key: Name
          Value: SolidarianID Data Volume
    DeletionPolicy: Retain

  DiskMountPoint:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref WebServerInstance
      VolumeId: !Ref DiskVolume
      Device: /dev/sdh

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SolidarianID microservices
      VpcId:
        Fn::ImportValue: !Sub ${NetworkStackName}-VPCID
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3002
          CidrIp: 0.0.0.0/0
          Description: NestJS microservices (admin, users, communities)
      Tags:
        - Key: Name
          Value: SolidarianID Security Group

Outputs:
  AdminURL:
    Description: URL of the admin application
    Value: !Sub "http://${WebServerInstance.PublicDnsName}:3000"

  UsersURL:
    Description: URL of the users microservice
    Value: !Sub "http://${WebServerInstance.PublicDnsName}:3001"

  CommunitiesURL:
    Description: URL of the communities microservice
    Value: !Sub "http://${WebServerInstance.PublicDnsName}:3002"
