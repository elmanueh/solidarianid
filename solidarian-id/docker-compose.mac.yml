services:
  postgres:
    image: postgres:16
    container_name: solidarian_postgres_db
    restart: always
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_USERS_DB}
      POSTGRES_USERS_DB: ${POSTGRES_USERS_DB}
      POSTGRES_COMMUNITIES_DB: ${POSTGRES_COMMUNITIES_DB}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./scripts/init/postgres/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
    networks:
      - solidarian_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo@sha256:4b58ebcb1dc7a7b4e84cd8ce9098d48764ae4478876898ff9551acf2ac4a6a6d
    container_name: solidarian_mongo_db
    restart: unless-stopped
    ports:
      - '${MONGO_PORT}:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ./data/mongodb:/data/db
      - ./scripts/init/mongo/00-seed-admins.js:/docker-entrypoint-initdb.d/00-seed-admins.js:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet --host 127.0.0.1 --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep 1 >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - solidarian_network

  kurrentdb:
    # kurrentplatform/kurrentdb:26.0
    image: kurrentplatform/kurrentdb@sha256:c1683160872027d06fdd2cac637cfa7aaae3e319b4852f1837aa4234100340ae
    container_name: solidarian_kurrentdb_db
    restart: unless-stopped
    ports:
      - '${KURRENTDB_PORT}:2113'
    environment:
      KURRENTDB_CLUSTER_SIZE: ${KURRENTDB_CLUSTER_SIZE}
      KURRENTDB_RUN_PROJECTIONS: ${KURRENTDB_RUN_PROJECTIONS}
      KURRENTDB_START_STANDARD_PROJECTIONS: ${KURRENTDB_START_STANDARD_PROJECTIONS}
      KURRENTDB_NODE_PORT: ${KURRENTDB_NODE_PORT}
      KURRENTDB_INSECURE: ${KURRENTDB_INSECURE}
      KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP: ${KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP}
    volumes:
      - ./data/kurrentdb:/var/lib/kurrentdb
      - ./data/kurrentdb-logs:/var/log/kurrentdb
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --insecure https://127.0.0.1:${KURRENTDB_PORT}/health/live || curl --fail http://127.0.0.1:${KURRENTDB_PORT}/health/live || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - solidarian_network

  kafka:
    image: apache/kafka@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    container_name: kafka
    hostname: kafka
    ports:
      - '${KAFKA_PORT}:9092'
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
    networks:
      - solidarian_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-init:
    image: apache/kafka@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/bash', '-lc']
    command: >
      "
      set -e;
      BOOTSTRAP=kafka:9093;

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic user-topic      --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic request-topic   --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic community-topic --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic cause-topic     --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic event-topic     --partitions 1 --replication-factor 1;

      echo 'Topics ready';
      "
    networks:
      - solidarian_network
    restart: 'no'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: solidarian_kafka_ui
    restart: unless-stopped
    ports:
      - '8089:8080'
    environment:
      - KAFKA_CLUSTERS_0_NAME=solidarian
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9093
    depends_on:
      - kafka
    networks:
      - solidarian_network

  nginx:
    build:
      context: ./apps/pasarela
      dockerfile: Dockerfile
    container_name: solidarian_proxy
    restart: unless-stopped
    ports:
      - '8090:80'
    environment:
      PEXELS_API_KEY: ${PEXELS_API_KEY}
    networks:
      - solidarian_network

networks:
  solidarian_network:
    driver: bridge
    name: solidarian_network
