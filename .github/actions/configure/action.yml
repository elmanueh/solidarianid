name: Setup Node + deps (SolidarianID)
description: Checkout, setup Node, cache npm, install deps

inputs:
  node-version:
    description: Node version
    required: true
    default: "24.x"
  working-directory:
    description: Working directory
    required: true
    default: "solidarian-id"
  fetch-depth:
    description: Depth for git checkout
    required: false
    default: "1"

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1 last version of the action checkout
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Setup Node.js
      uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #v6.1.0 last version of the action setup-node
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
