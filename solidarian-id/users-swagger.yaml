openapi: 3.0.0
paths:
  /users:
    post:
      operationId: UsersController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserDtoRequest'
      responses:
        '201':
          description: User created successfully
        '400':
          description: Invalid request payload
        '409':
          description: >-
            Either the username or the phone number (or both) were registered
            previously
        '500':
          description: Internal server error
      summary: Creating an account for SolidarianID
      tags:
        - Users
info:
  title: 'SolidarianID: Users Microservice'
  description: The SolidarianID`s Users Microservice API documentation
  version: '0.1'
  contact: {}
tags: []
servers: []
components:
  schemas:
    RegisterUserDtoRequest:
      type: object
      properties:
        username:
          type: string
          description: Username for the new user´containing only alphanumeric characters
          example: johnDoe
          minLength: 2
          maxLength: 16
        mobilePhone:
          type: string
          description: Mobile phone number of the user in E.164 format
          example: '+34612345678'
        password:
          type: string
          description: >-
            Password for the user account with at least a symbol, a number, and
            an uppercase letter
          example: SecureP@ssw0rd
          minLength: 12
        city:
          type: string
          description: City where the user resides
          example: Madrid
          minLength: 1
          maxLength: 25
        countryCode:
          type: string
          description: ISO 3166-1 alpha-2 country code
          example: ES
      required:
        - username
        - mobilePhone
        - password
        - city
        - countryCode
