name: CI - SolidarianID - Frontend

on:
  # El CI se ejecutará en cada push o pull request a la rama develop
  push:
    paths:
      - "solidarian-frontend/**"
    branches: [develop]
  pull_request:
    paths:
      - "solidarian-frontend/**"
    branches: [develop]
  workflow_dispatch:

jobs:
  setup-and-format:
    name: CI Pipeline - Frontend
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: solidarian-frontend
    strategy:
      matrix:
        node-version: [24.x]
        pnpm-version: [10]

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 #pnpm/action-setup@v5.0.0
        with:
          version: ${{ matrix['pnpm-version'] }}

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f #actions/setup-node@v6.0.1
        with:
          node-version: ${{ matrix['node-version'] }}
          cache: pnpm
          cache-dependency-path: solidarian-frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run prettier check
        id: prettier_check
        continue-on-error: false
        run: pnpm run check-format
        
      - name: Run linter
        run: pnpm run lint

      - name: Run type checking
        run: pnpm run typecheck

      - name: Build project
        run: pnpm run build
