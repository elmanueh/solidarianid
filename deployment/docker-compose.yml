services:
  admin-app:
    build:
      context: ../solidarian-id
      dockerfile: ../deployment/dockerfile-admin
    container_name: solidarian_admin_app
    restart: unless-stopped
    ports:
      - "3000:3000" # Admin app
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - MONGO_HOST=${MONGO_HOST}
      - MONGO_PORT=27017
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB=${MONGO_DB}
      - KAFKA_BROKERS=kafka:9093
      - API_BASE_ADMIN_URL=${API_BASE_ADMIN_URL}
      - API_BASE_USERS_URL=${API_BASE_USERS_URL}
      - API_BASE_COMMUNITIES_URL=${API_BASE_COMMUNITIES_URL}
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - solidarian_network

  user-app:
    build:
      context: ../solidarian-id
      dockerfile: ../deployment/dockerfile-user
    container_name: solidarian_user_app
    restart: unless-stopped
    ports:
      - "3001:3001" # Users app
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KAFKA_BROKERS=kafka:9093
      - API_BASE_ADMIN_URL=${API_BASE_ADMIN_URL}
      - API_BASE_USERS_URL=${API_BASE_USERS_URL}
      - API_BASE_COMMUNITIES_URL=${API_BASE_COMMUNITIES_URL}
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - solidarian_network

  community-app:
    build:
      context: ../solidarian-id
      dockerfile: ../deployment/dockerfile-community
    container_name: solidarian_community_app
    restart: unless-stopped
    ports:
      - "3002:3002" # Communities app
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - KAFKA_BROKERS=kafka:9093
      - API_BASE_ADMIN_URL=${API_BASE_ADMIN_URL}
      - API_BASE_USERS_URL=${API_BASE_USERS_URL}
      - API_BASE_COMMUNITIES_URL=${API_BASE_COMMUNITIES_URL}
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - solidarian_network

  postgres:
    image: postgres:16
    container_name: solidarian_postgres_db
    restart: always
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - solidarian_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solidarian_user -d solidarian_id_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo@sha256:4b58ebcb1dc7a7b4e84cd8ce9098d48764ae4478876898ff9551acf2ac4a6a6d
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - ./data/mongodb:/data/db
      - ./scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - solidarian_network

  kafka:
    image: apache/kafka@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: "CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9092,DOCKER://kafka:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9091"
      KAFKA_INTER_BROKER_LISTENER_NAME: "DOCKER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - solidarian_network

  kafka-init:
    image: apache/kafka@sha256:0bc1bb2478f45b6cea78864df86acdc11e8df2c5172477819a4d12942cbe5d40
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
      set -e;
      BOOTSTRAP=kafka:9093;

      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic user-topic      --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic request-topic   --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic community-topic --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic cause-topic     --partitions 1 --replication-factor 1;
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists --topic event-topic     --partitions 1 --replication-factor 1;

      echo 'Topics ready';
      "
    networks:
      - solidarian_network
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: solidarian_kafka_ui
    restart: unless-stopped
    ports:
      - "8089:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=solidarian
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9093
    depends_on:
      - kafka
    networks:
      - solidarian_network

volumes:
  postgres_data:
    driver: local
    name: solidarian_postgres_data

networks:
  solidarian_network:
    driver: bridge
    name: solidarian_network
