repos:
  - repo: local
    hooks:
      - id: prettier-format-solidarian-id
        name: Prettier format (solidarian-id)
        language: system
        entry: bash -c "cd ./solidarian-id && npm run prettier:write"
        always_run: true
        pass_filenames: false
      - id: prettier-format-solidarian-frontend
        name: Prettier format (solidarian-frontend)
        language: system
        entry: bash -c "cd ./solidarian-frontend && pnpm run format"
        always_run: true
        pass_filenames: false